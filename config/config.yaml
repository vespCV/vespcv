# VespaCV Configuration File
# ========================

# File System Configuration
# ------------------------
model_path: "models/yolo112025-04-23default_e200_p20_b-1_augment/weights/best.pt"
images_folder: "/home/vcv/vespcv/data/images"
log_file_path: 'data/logs/detector.log'

# Detection Configuration
# ----------------------
# Confidence threshold (0.0 - 1.0)
# Higher values require stronger confidence for detections
conf_threshold: 0.80

# Target species for detection
class_names: ['amel', 'vcra', 'vespsp', 'vvel', 'vzon']


# Timing Configuration
# ------------------
# Time between consecutive image captures (in seconds)
capture_interval: 15

# Time window for grouping detections in charts (in minutes)
chart_interval: 15

# Hardware Configuration
# --------------------
# Camera type: 'pi' for Camera Module 3 (default), 'arducam' for Arducam IMX519
camera_type: arducam  # Changed to pi camera as default

# Camera settings
camera:
  width: 1920
  height: 1440
  framerate: 30
  autofocus_mode: false  # Set to true to enable autofocus, false to disable
  autofocus_enabled: true  # Set to true to enable autofocus, false to disable
  gain: 6.0  # Set the gain value for image capture
  timeout: 5000
  lens_position: 10  # Set lens position for focusing at 10 cm
  # lens_position: 
  #   - 0: Far distance (approximately 3 meters)
  #   - 1: Medium distance (approximately 1 meter)
  #   - 10: Close-up (approximately 10 centimeters)
  # This setting adjusts the focus distance of the Arducam lens.
  # Ensure the lens is set to the correct position for optimal focus.

# GPIO control settings
led:
  pin: 21          # GPIO pin number for the LED
  on_duration: 3   # LED activation duration after detection (in seconds)
  enabled: false   # Whether GPIO control is enabled by default

# Mail Alert Configuration
# -------------------
# Enable/disable features by default
mail_alert_enabled: false  # Whether mail alerts are enabled by default

# Camera Type
# Default is Camera Module 3 (pi)
# Arducam IMX519 is supported (arducam)
camera_type: arducam